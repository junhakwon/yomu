{"name": "update feeds", "on": {"schedule": [{"cron": "17 */3 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"update": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-node@v4", "with": {"node-version": "22"}}, {"run": "node update.js"}, {"run": "git config user.name github-actions && git config user.email github-actions@users.noreply.github.com && git add feeds.json && (git diff --cached --quiet || git commit -m 'update feeds') && git push"}]}}}
